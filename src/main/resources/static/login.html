<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Consistify — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{
          min-height:100vh;display:flex;align-items:center;justify-content:center;
          background:#0d0f12;font-family:'DM Mono',monospace;
        }
        body::before{
          content:'';position:fixed;inset:0;pointer-events:none;
          background-image:linear-gradient(rgba(200,241,53,.025) 1px,transparent 1px),
            linear-gradient(90deg,rgba(200,241,53,.025) 1px,transparent 1px);
          background-size:52px 52px;
        }
        .box{
          background:#13161c;border:1px solid #242933;border-radius:16px;
          padding:40px 36px;width:100%;max-width:420px;position:relative;z-index:1;
        }
        .logo{text-align:center;margin-bottom:28px}
        .logo-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#eef1f6}
        .logo-title span{color:#c8f135}
        .logo-sub{font-size:10px;color:#616878;letter-spacing:2px;text-transform:uppercase;margin-top:4px}

        /* TABS */
        .tabs{display:flex;gap:4px;background:#0d0f12;border-radius:10px;padding:4px;margin-bottom:24px}
        .tab{
          flex:1;padding:8px;border-radius:7px;border:none;background:transparent;
          color:#616878;font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;transition:all .2s;
        }
        .tab.active{background:#191d26;color:#eef1f6;border:1px solid #242933}

        /* PANELS */
        .panel{display:none}
        .panel.active{display:block}

        .fg{margin-bottom:14px}
        .fg label{display:block;font-size:10px;color:#8892a4;margin-bottom:5px;
          text-transform:uppercase;letter-spacing:.8px}
        .fg input{
          width:100%;background:#0d0f12;border:1px solid #242933;
          border-radius:9px;padding:10px 14px;color:#eef1f6;
          font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color .2s;
        }
        .fg input:focus{border-color:#c8f135}

        .btn{
          width:100%;padding:12px;border-radius:9px;font-family:'DM Mono',monospace;
          font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;
          border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;
        }
        .btn-p{background:#c8f135;color:#000;border-color:#c8f135;margin-bottom:10px}
        .btn-p:hover{background:#d4ff44}
        .btn-g{background:#191d26;color:#eef1f6;border-color:#242933}
        .btn-g:hover{border-color:#616878}
        .btn:disabled{opacity:.5;cursor:not-allowed}

        .divider{
          display:flex;align-items:center;gap:10px;margin:16px 0;
          font-size:10px;color:#616878;
        }
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:#242933}

        .err{
          background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.25);
          border-radius:8px;padding:10px 14px;font-size:12px;color:#ff5c5c;
          margin-bottom:14px;display:none;
        }
        .suc{
          background:rgba(200,241,53,.1);border:1px solid rgba(200,241,53,.25);
          border-radius:8px;padding:10px 14px;font-size:12px;color:#c8f135;
          margin-bottom:14px;display:none;
        }
        .footer{text-align:center;font-size:10px;color:#616878;margin-top:20px}
    </style>
</head>
<body>
<div class="box">
    <div class="logo">
        <div class="logo-title">Con<span>sist</span>ify</div>
        <div class="logo-sub">Track honestly. Learn consistently.</div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('google')">Google</button>
        <button class="tab" onclick="switchTab('login')">Sign In</button>
        <button class="tab" onclick="switchTab('register')">Sign Up</button>
    </div>

    <!-- GOOGLE PANEL -->
    <div class="panel active" id="panel-google">
        <p style="text-align:center;font-size:13px;color:#8892a4;margin-bottom:24px;line-height:1.6">
            Sign in with Google to continue tracking<br>your learning progress.
        </p>
        <a href="/oauth2/authorization/google">
            <button class="btn btn-g">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
        </a>
        <div class="footer">No ads. No data selling.<br>Your learning history stays private.</div>
    </div>

    <!-- LOGIN PANEL -->
    <div class="panel" id="panel-login">
        <div class="err" id="login-err"></div>
        <div class="fg"><label>Email</label><input id="li-email" type="email" placeholder="you@example.com"/></div>
        <div class="fg"><label>Password</label><input id="li-pass" type="password" placeholder="••••••••"/></div>
        <button class="btn btn-p" id="li-btn" onclick="doLogin()">Sign In</button>
        <div class="divider">or</div>
        <a href="/oauth2/authorization/google">
            <button class="btn btn-g">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
        </a>
    </div>

    <!-- REGISTER PANEL -->
    <div class="panel" id="panel-register">
        <div class="err" id="reg-err"></div>
        <div class="suc" id="reg-suc"></div>
        <div class="fg"><label>Full Name</label><input id="rg-name" type="text" placeholder="Your name"/></div>
        <div class="fg"><label>Email</label><input id="rg-email" type="email" placeholder="you@example.com"/></div>
        <div class="fg"><label>Password</label><input id="rg-pass" type="password" placeholder="Min 6 characters"/></div>
        <button class="btn btn-p" id="rg-btn" onclick="doRegister()">Create Account</button>
        <div class="divider">or</div>
        <a href="/oauth2/authorization/google">
            <button class="btn btn-g">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
        </a>
    </div>
</div>

<script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => {
        t.classList.toggle('active', ['google','login','register'][i] === tab);
      });
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');
    }

    async function doLogin() {
      const email = document.getElementById('li-email').value.trim();
      const pass  = document.getElementById('li-pass').value;
      const err   = document.getElementById('login-err');
      const btn   = document.getElementById('li-btn');
      err.style.display = 'none';
      if (!email || !pass) { err.textContent='Fill in all fields'; err.style.display='block'; return; }
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const r = await fetch('/api/auth/login', {
          method:'POST', credentials:'include',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, password: pass })
        });
        if (r.ok) {
          location.replace('/index.html');
        } else {
          const msg = await r.text();
          err.textContent = msg || 'Invalid email or password';
          err.style.display = 'block';
        }
      } catch(_) {
        err.textContent = 'Network error. Try again.';
        err.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'Sign In';
    }

    async function doRegister() {
      const name  = document.getElementById('rg-name').value.trim();
      const email = document.getElementById('rg-email').value.trim();
      const pass  = document.getElementById('rg-pass').value;
      const err   = document.getElementById('reg-err');
      const suc   = document.getElementById('reg-suc');
      const btn   = document.getElementById('rg-btn');
      err.style.display = 'none'; suc.style.display = 'none';
      if (!name)           { err.textContent='Name is required'; err.style.display='block'; return; }
      if (!email)          { err.textContent='Email is required'; err.style.display='block'; return; }
      if (pass.length < 6) { err.textContent='Password must be at least 6 characters'; err.style.display='block'; return; }
      btn.disabled = true; btn.textContent = 'Creating account…';
      try {
        const r = await fetch('/api/auth/register', {
          method:'POST', credentials:'include',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ name, email, password: pass })
        });
        if (r.ok) {
          location.replace('/index.html');
        } else {
          const msg = await r.text();
          err.textContent = msg || 'Registration failed';
          err.style.display = 'block';
        }
      } catch(_) {
        err.textContent = 'Network error. Try again.';
        err.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'Create Account';
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const active = document.querySelector('.panel.active').id;
      if (active === 'panel-login')    doLogin();
      if (active === 'panel-register') doRegister();
    });
</script>
</body>
</html>
